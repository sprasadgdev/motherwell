name: tool-tests

# Runs on every push and pull request. No Azure, no secrets, no model:
# it proves the deterministic tool behaves exactly as documented.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q tests
